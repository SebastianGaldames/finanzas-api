version: '3.8'
services:
  mongo:
    image: mongo:7
    container_name: mongo_finanzas
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: finanzas_api
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - mongo
    volumes:
      - .:/app

volumes:
  mongo_data:
